name: 🏠 경매 데이터 수집·분석

# 매일(평일) 08:30 KST 실행
#   GitHub cron 은 UTC 기준 → 23:30 UTC (일~목) = 08:30 KST (월~금)
# 정부 사이트(공공데이터포털·주소·법원경매)는 GitHub 서버(해외 IP)에서 접속이 될 때도 있고 안 될 때도 있어,
# 같은 날 10:30 / 13:30 / 16:30 KST 에 다시 시도한다. 이미 처리된 물건은 건너뛰므로 중복 작업은 없다.
on:
  schedule:
    - cron: '30 23 * * 0-4'
    - cron: '30 1,4,7 * * 1-5'
  workflow_dispatch:            # Actions 탭에서 수동 실행
    inputs:
      skip_scrape:
        description: '목록 수집 생략 (기존 데이터로 분석만)'
        type: boolean
        default: false
      limit:
        description: '신규 분석 최대 건수 (비우면 기본값 1000)'
        required: false
        default: ''

permissions:
  contents: write               # 데이터 커밋·푸시용

concurrency:                    # 동시에 두 번 돌지 않도록
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'

    steps:
      # 항상 브랜치의 최신 상태를 받음 → "Re-run jobs" 로 다시 돌려도 예전 스냅샷과 충돌하지 않음
      - name: 📥 레포 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: 📦 의존성 설치
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install chromium --with-deps

      # 실거래가·주소·분석 캐시 복원 → API 호출량 절감 (커밋하지 않고 Actions 캐시에 보관)
      - name: 🗂️ API 캐시 복원
        uses: actions/cache@v4
        with:
          path: scraper/.cache
          key: api-cache-${{ github.run_id }}
          restore-keys: |
            api-cache-

      - name: 🚀 파이프라인 실행 (main.py)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}          # 선택 (없으면 자동 생략)
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}    # 선택
        run: |
          ARGS=""
          # 예약 실행: 오늘 이미 목록 수집에 성공했으면 수집은 건너뛰고 분석만 이어서 진행
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --scrape-if-needed"; fi
          if [ "${{ github.event.inputs.skip_scrape }}" = "true" ]; then ARGS="$ARGS --skip-scrape"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python scraper/main.py $ARGS

      - name: 📊 변경 확인 및 커밋
        if: success()
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # auctions.json 이 바뀐 경우에만 커밋 (error_log.json 은 함께 커밋)
          if git diff --quiet -- docs/data/auctions.json; then
            echo "✅ auctions.json 변경 없음 — 커밋 스킵"
            exit 0
          fi

          git add docs/data/auctions.json docs/data/error_log.json
          COUNT=$(python -c "import json; print(len(json.load(open('docs/data/auctions.json')).get('auctions', [])))")
          git commit -m "🏠 경매 데이터 업데이트: $(date '+%Y-%m-%d %H:%M') KST (총 ${COUNT}건)"

          # 푸시 (충돌 시 rebase 후 최대 3회 재시도)
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true
            echo "⚠ 푸시 실패 (${i}/3) — 재시도"
            sleep $((i * 5))
          done
          echo "❌ 푸시 최종 실패"
          exit 1

      # 실행 결과 로그는 커밋 여부와 관계없이 아티팩트로 보관 (Actions 실행 화면에서 다운로드)
      - name: 📝 오류 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ github.run_id }}
          path: docs/data/error_log.json
          if-no-files-found: ignore
          retention-days: 14
