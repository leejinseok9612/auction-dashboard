name: 🏠 경매 데이터 수집·분석

# 평일 08:30 KST 실행 (GitHub cron 은 UTC → 23:30 UTC 일~목 = 08:30 KST 월~금)
#   ※ GitHub 예약 실행은 정시에 시작되지 않고 몇 시간 늦어질 수 있어 10:30 / 13:30 / 16:30 KST 에도 걸어 둔다.
#     이미 처리된 물건은 건너뛰므로 여러 번 돌아도 중복 작업은 없다.
#
# 정부 사이트(공공데이터포털·법원경매)는 GitHub 서버(해외 IP)에서 접속이 될 때도 있고 안 될 때도 있다.
# 서버마다 IP 가 달라 "다른 서버에서 다시 시도"하면 대개 연결되므로, 실패하면 이 워크플로가 자신을 다시 실행한다 (최대 10회).
on:
  schedule:
    - cron: '30 23 * * 0-4'
    - cron: '30 1,4,7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 방식 (full = 수집+분석 / enrich = 공공데이터 분석만 / price = 공시가격만)'
        type: choice
        options: [full, enrich, price]
        default: full
      skip_scrape:
        description: '목록 수집 생략 (기존 데이터로 분석만)'
        type: boolean
        default: false
      limit:
        description: '신규 분석 최대 건수 (비우면 기본값 1000)'
        required: false
        default: ''
      attempt:
        description: '자동 재시도 회차 (직접 실행할 때는 그대로 두세요)'
        required: false
        default: '1'

permissions:
  contents: write               # 데이터 커밋·푸시
  actions: write                # 접속 실패 시 자기 자신을 다시 실행

concurrency:                    # 동시에 두 번 돌지 않도록
  group: update-data-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: '1'
  MODE: ${{ github.event.inputs.mode || 'full' }}
  ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
  MAX_ATTEMPTS: '10'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 항상 브랜치의 최신 상태를 받음 → "Re-run jobs" 로 다시 돌려도 예전 스냅샷과 충돌하지 않음
      - name: 📥 레포 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # enrich 방식: 공공데이터포털에 연결되는 서버인지 먼저 확인 — 안 되면 바로 다른 서버로 넘김 (20초 안에 끝남)
      - name: 🔌 공공데이터포털 접속 확인
        id: preflight
        run: |
          CODE=$(curl -s -o /dev/null -m 8 -w '%{http_code}' https://apis.data.go.kr/1613000/BldRgstHubService/getBrTitleInfo || true)
          echo "data.go.kr 응답 코드: ${CODE}"
          if [ "${CODE}" = "000" ]; then echo "reachable=false" >> "$GITHUB_OUTPUT"; else echo "reachable=true" >> "$GITHUB_OUTPUT"; fi

      # 브이월드(공시가격) 접속 확인 — 결과만 기록 (인증키는 보내지 않음)
      - name: 🔌 브이월드 접속 확인
        id: vworld
        run: |
          for U in https://api.vworld.kr/ned/data/getApartHousingPriceAttr http://api.vworld.kr/ned/data/getApartHousingPriceAttr; do
            echo "── ${U}"
            curl -sS -o /tmp/vw.txt -m 10 -w 'code=%{http_code} ip=%{remote_ip} t=%{time_total}\n' "${U}" 2>&1 | tail -3 || true
            head -c 300 /tmp/vw.txt 2>/dev/null || true; echo
          done

      - name: 🐍 Python 3.11 설정
        if: env.MODE != 'enrich' || steps.preflight.outputs.reachable == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: 📦 의존성 설치
        if: env.MODE != 'enrich' || steps.preflight.outputs.reachable == 'true'
        run: |
          pip install -r scraper/requirements.txt
          # 브라우저는 법원경매 수집·권리분석(full)에만 필요
          if [ "${MODE}" = "full" ]; then python -m playwright install chromium --with-deps; fi

      # 실거래가·주소·분석 캐시 복원 → API 호출량 절감 (커밋하지 않고 Actions 캐시에 보관)
      - name: 🗂️ API 캐시 복원
        if: env.MODE != 'enrich' || steps.preflight.outputs.reachable == 'true'
        uses: actions/cache@v4
        with:
          path: scraper/.cache
          key: api-cache-${{ github.run_id }}
          restore-keys: |
            api-cache-

      - name: 🚀 파이프라인 실행 (main.py)
        if: env.MODE != 'enrich' || steps.preflight.outputs.reachable == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}          # 선택 (없으면 자동 생략)
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}    # 선택
        run: |
          ARGS=""
          if [ "${MODE}" = "enrich" ]; then
            ARGS="--skip-scrape --no-rights"             # 공공데이터 분석만
          elif [ "${MODE}" = "price" ]; then
            ARGS="--skip-scrape --no-rights --price-only"   # 공시가격만
          else
            # 예약 실행: 오늘 이미 목록 수집에 성공했으면 수집은 건너뛰고 분석만 이어서 진행
            if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --scrape-if-needed"; fi
            if [ "${{ github.event.inputs.skip_scrape }}" = "true" ]; then ARGS="$ARGS --skip-scrape"; fi
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python scraper/main.py $ARGS

      - name: 📊 변경 확인 및 커밋
        if: success() && (env.MODE != 'enrich' || steps.preflight.outputs.reachable == 'true')
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # auctions.json 이 바뀐 경우에만 커밋 (error_log.json 은 함께 커밋)
          if git diff --quiet -- docs/data/auctions.json; then
            echo "✅ auctions.json 변경 없음 — 커밋 스킵"
            exit 0
          fi

          git add docs/data/auctions.json docs/data/error_log.json
          COUNT=$(python -c "import json; print(len(json.load(open('docs/data/auctions.json')).get('auctions', [])))")
          git commit -m "🏠 경매 데이터 업데이트: $(date '+%Y-%m-%d %H:%M') KST (총 ${COUNT}건)"

          # 푸시 (충돌 시 rebase 후 최대 3회 재시도)
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true
            echo "⚠ 푸시 실패 (${i}/3) — 재시도"
            sleep $((i * 5))
          done
          echo "❌ 푸시 최종 실패"
          exit 1

      # 접속이 안 됐거나 분석할 물건이 남았으면 다른 서버에서 이어서 실행
      - name: 🔁 이어서 실행 (다른 서버에서 재시도)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REACHABLE: ${{ steps.preflight.outputs.reachable }}
        run: |
          NEXT=$(python3 - <<'PY'
          import json, os
          mode, attempt, mx = os.environ["MODE"], int(os.environ["ATTEMPT"]), int(os.environ["MAX_ATTEMPTS"])
          reach = os.environ.get("REACHABLE") == "true"
          nxt = ""
          if attempt < mx:
              if mode == "enrich" and not reach:
                  nxt = "enrich"                       # 이 서버는 접속 불가 → 다른 서버로
              else:
                  try:
                      s = json.load(open("docs/data/error_log.json")).get("summary", {})
                  except Exception:
                      s = {}
                  dead = "apis.data.go.kr" in (s.get("unreachable_hosts") or {})
                  quota = any(("트래픽 초과" in str(v) or "EXCEEDS" in str(v)) for v in (s.get("blocked_endpoints") or {}).values())
                  pending = int(s.get("pending_enrich") or 0)
                  vw_dead = "api.vworld.kr" in (s.get("unreachable_hosts") or {})
                  vw_blocked = any(str(k).startswith("price:vworld") and ("브이월드 오류" in str(v) or "인증" in str(v))
                                   for k, v in (s.get("blocked_endpoints") or {}).items())   # 키·한도 문제 (서버를 바꿔도 소용없음)
                  pending_price = int(s.get("pending_price") or 0)
                  if mode == "price":
                      pass                             # 브이월드는 해외 서버 접속을 일관되게 거부 → 서버를 바꿔도 소용없어 재시도하지 않음
                  elif mode == "full" and s.get("scrape_ok") is False and attempt < 4:
                      nxt = "full"                     # 법원 사이트 접속 실패 → 수집부터 다시
                  elif dead or (pending > 0 and not quota):
                      nxt = "enrich"                   # 공공데이터 접속 실패 또는 남은 물건 있음
          print(nxt)
          PY
          )
          if [ -z "${NEXT}" ]; then echo "이어서 실행할 필요 없음"; exit 0; fi
          echo "➡ ${NEXT} 방식으로 다시 실행 (회차 $((ATTEMPT + 1))/${MAX_ATTEMPTS})"
          gh workflow run update-data.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" \
            -f mode="${NEXT}" -f attempt="$((ATTEMPT + 1))" -f limit="${{ github.event.inputs.limit }}"

      # 실행 결과 로그는 커밋 여부와 관계없이 아티팩트로 보관 (Actions 실행 화면에서 다운로드)
      - name: 📝 오류 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ github.run_id }}
          path: docs/data/error_log.json
          if-no-files-found: ignore
          retention-days: 14
