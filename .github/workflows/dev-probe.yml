name: 🔬 dev 탐침 (데이터 품질 작업용)

# dev/** 가지에 푸시될 때만 실행. main 과 실제 사이트에는 영향 없음.
on:
  push:
    branches: ['dev/**']

permissions:
  contents: write

concurrency:
  group: dev-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt
      - name: 의존성 설치
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install chromium --with-deps
      - name: dev 명령 실행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
        run: bash scraper/dev_cmd.sh
      - name: 결과를 dev 가지에 저장
        if: always()
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A scraper/dev_out docs/data 2>/dev/null || true
          git diff --staged --quiet || git commit -m "dev: 탐침 결과"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" || true
