name: 🔬 dev 탐침 (데이터 품질 작업용)

# dev/** 가지에 푸시될 때만 실행. main 과 실제 사이트에는 영향 없음.
on:
  push:
    branches: ['dev/**']

permissions:
  contents: write

concurrency:
  group: dev-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      # 공공데이터포털에 연결되는 서버가 걸릴 때까지 빨리 실패시키기 위한 확인 (scraper/.dev_need_datagokr 파일이 있을 때만)
      - name: 접속 확인
        id: pf
        run: |
          OK=true
          if [ -f scraper/.dev_need_datagokr ]; then
            CODE=$(curl -s -o /dev/null -m 8 -w '%{http_code}' https://apis.data.go.kr/1613000/BldRgstHubService/getBrTitleInfo || true)
            echo "data.go.kr: ${CODE}"
            if [ "${CODE}" = "000" ]; then OK=false; echo "UNREACHABLE"; fi
          fi
          echo "ok=${OK}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.pf.outputs.ok == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt
      - name: 의존성 설치
        if: steps.pf.outputs.ok == 'true'
        run: |
          pip install -r scraper/requirements.txt
          if [ ! -f scraper/.dev_no_browser ]; then python -m playwright install chromium --with-deps; fi
      - name: dev 명령 실행
        if: steps.pf.outputs.ok == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          JUSO_CONFIRM_KEY: ${{ secrets.JUSO_CONFIRM_KEY }}
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
        run: bash scraper/dev_cmd.sh
      - name: 결과를 dev 가지에 저장
        if: always()
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A docs/data || true
          [ -d scraper/dev_out ] && git add -A scraper/dev_out || true
          git diff --staged --quiet || git commit -m "dev: 실행 결과"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" || true
